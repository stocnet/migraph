reference:
  - title: "Learning"
    desc: |
      Functions for running tutorials from all the stocnet packages,
      and for extracting their code.
    contents:
      - tutorials

  - title: "Keeping current"
    desc: |
      Functions for checking and installing the newest versions of the stocnet packages.
    contents:
      - update_versions

  - title: "Data"
    desc: |
      The package contains multimodal, multilevel, and multiplex network data,
      used in the book _Multimodal Political Networks_ (prefixed with `mpn_`).
    contents:
      - starts_with("mpn_")

  - title: "Other"
    desc: "Functions for measuring over many elements:"
    contents:
      - measure_over
